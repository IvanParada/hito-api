version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: hito_postgres
    restart: always
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: hito_db
      POSTGRES_USER: hito_user
      POSTGRES_PASSWORD: hito_pass
    volumes:
      - pgdata:/var/lib/postgresql/data
    
  redis:
    image: redis:7-alpine
    container_name: hito_redis
    restart: always
    ports:
      - "6379:6379"

volumes:
  pgdata: